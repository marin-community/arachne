[package]
name = "arachne"
version = "0.1.0"
description = "Arachne — a macOS coding cockpit over Loom"
edition = "2021"
rust-version = "1.82"

[lib]
name = "arachne_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
thiserror = "2"
# macOS Keychain storage for the loom bearer token (spec: credentials never
# persist in frontend localStorage). Blocking ops run via spawn_blocking.
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
